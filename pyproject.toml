[project]
name = "certifier-backend"
version = "0.1.0"
description = "Certificate Generator"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django==5.2",
    "djangorestframework>=3.16.1",
    "psycopg2-binary>=2.9.11",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.1",
    "uuid6>=2025.0.1",
]

[dependency-groups]
dev = [
    "django-cors-headers>=4.9.0",
    "django-sslserver-v2>=1.0",
]
